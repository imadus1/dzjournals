<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f9fafb; font-family: sans-serif; color: #374151; padding: 20px;}
        .loader { border: 4px solid #e5e7eb; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .text-center { text-align: center; max-width: 600px; word-wrap: break-word; }
    </style>
</head>
<body>

    <div class="text-center" id="status-container">
        <div class="loader"></div>
        <p id="status-text">Connecting to secure database...</p>
    </div>

    <script>
        // RENAMED VARIABLES so they don't collide with your injected HTML
        const LOADER_URL = "https://afollbwkvfzhnvpbbnss.supabase.co";
        const LOADER_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmb2xsYndrdmZ6aG52cGJibnNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDgyMzgsImV4cCI6MjEwMDMyNDIzOH0.FVuliZh-KITh7yN8Q42rUEhwb_El4t9XgOGclVNRCaQ";
        const COMPONENT_NAME = "main_app_test";

        async function loadHiddenApp() {
            const url = `${LOADER_URL}/rest/v1/hidden_dz_test?component_name=eq.${COMPONENT_NAME}&select=html_string`;

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': LOADER_KEY,
                        'Authorization': `Bearer ${LOADER_KEY}`
                    }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Supabase Error ${response.status}: ${errorText}`);
                }

                const data = await response.json();

                if (data && data.length > 0) {
                    const secretHTML = data[0].html_string;
                    document.open();
                    document.write(secretHTML);
                    document.close();
                } else {
                    throw new Error("Connected successfully, but no row was found. Check spelling!");
                }

            } catch (error) {
                console.error(error);
                document.getElementById('status-text').innerHTML = `<b>Error:</b> <br><br> ${error.message}`;
                document.getElementById('status-text').style.color = "red";
                document.querySelector('.loader').style.display = "none";
            }
        }

        loadHiddenApp();
    </script>
</body>
</html>
